name: Weekly Lotto Update & WASM Build

# 시나리오 기반
# pm 9:00, 9:05, 9:10 retry.
# next day am 9:00

# python sys.exit(status) 설정값
# SUCCESS = 0
# FAILURE, TIMEOUT, NO_DATA = 1(retry)

on:
  schedule:
    - cron: "0 12 * * 6" # 매주 토요일 21:00 KST
    - cron: "0 0 * * 0" # 일요일 아침 9시
  workflow_dispatch:
    inputs:
      force_build:
        description: "새 회차가 없어도 기존 데이터로 WASM 빌드 + 배포"
        type: boolean
        default: true
  # 엔진/파이프라인 코드가 바뀌면 WASM을 다시 빌드해야 하므로 여기서 처리
  # (deploy.yaml 은 FE만 빌드하므로 이 경로들은 paths-ignore 로 넘겨받음)
  # 봇(GITHUB_TOKEN)의 push 는 워크플로를 트리거하지 않아 루프 없음
  push:
    branches:
      - main
    paths:
      - "wasm/src/**"
      - "!wasm/src/lotto_data.h"
      - "script/**"
      - "requirements.txt"

# 두 실행이 동시에 main 에 push 하지 않도록 직렬화
concurrency:
  group: "lotto-update"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Emscripten (emsdk) 설정
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "5.0.7"
          actions-cache-folder: "emsdk-cache"

      # 4. 통합 파이프라인 실행 (실패 시 5분 뒤 자동 재시도)
      - name: Run Total Pipeline with Retry
        id: pipeline
        uses: nick-fields/retry@v3
        with:
          # auto retry
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 300
          retry_on_exit_code: 1,11,124
          command: |
            pip install -r requirements.txt
            python script/main.py
        env:
          LOTTO_PRIVATE_KEY: ${{ secrets.LOTTO_PRIVATE_KEY }}
          SEC_KEY: ${{ secrets.SEC_KEY }} # 파이썬 내부 builder.py가 쓸 수 있게 주입
          # 스케줄 실행은 새 회차가 있을 때만 빌드, 코드 push / 수동 실행(force_build)은 항상 빌드
          FORCE_BUILD: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_build)) && '1' || '0' }}

      # 5. 변경된 파일(JSON, WASM 등)을 Git에 커밋 및 푸시
      - name: Commit and Push changes
        id: commit
        if: steps.pipeline.outcome == 'success' # exit 0(success)으로 끝났을 때만 실행
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ fe/src/wasm/ fe/public/data/
          git add -f wasm/src/lotto_data.h
          git add -f fe/public/data/lotto_history.json
          git add -f fe/src/wasm/engine.js
          git add -f fe/src/wasm/engine.wasm

          if ! git diff --staged --quiet; then
            git commit -m "chore: 고유 데이터 및 WASM 엔진 자동 업데이트"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit. Pipeline finished gracefully."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # 6. 커밋이 발생했거나(데이터/엔진 변경) 수동 실행인 경우 GitHub Pages 재배포
  deploy:
    needs: update-and-build
    if: needs.update-and-build.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      pages: write
      id-token: write
